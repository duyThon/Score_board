<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Board</title>
    <link rel="icon" href="./assets/teams-logo/default-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rowdies:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,800;1,800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <!-- Tailwind + GSAP -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              roboto: ['"Roboto"', "serif"],
              rowdies: ['"Rowdies"', "serif"],
            },
          },
        },
      };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="style.css" />;
    <script type="text/babel">
      // Ô điểm có animation: số cũ trượt lên biến mất, số mới trượt từ dưới lên,
      // kèm nhãn chênh lệch ("+2" / "−1") bay lên rồi mờ dần.
      // Dùng GSAP core (đã nạp sẵn trong trang), không cần plugin.
      // Remote chỉ có nút +1, nên một pha 3 điểm là 3 lần bấm liên tiếp.
      // Gom các lần bấm cách nhau dưới ngưỡng này thành MỘT animation duy nhất,
      // để khán giả thấy "+3" thay vì ba lần "+1".
      const SCORE_BURST_MS = 700;
      // Chênh lệch lớn hơn mức này coi như sửa điểm bằng tay -> không hiện nhãn
      const MAX_BADGE_DELTA = 9;

      const ScoreBox = ({ value, fontSizeClass, suppressAnimRef }) => {
        const { useState, useEffect, useRef } = React;
        // Số đang hiển thị (giữ nguyên trong lúc chờ gom điểm)
        const [displayed, setDisplayed] = useState(value);
        const displayedRef = useRef(value);
        const burstTimerRef = useRef(null);
        const pendingAnimRef = useRef(null);
        const isFirstRenderRef = useRef(true);
        const wrapRef = useRef(null);
        const numRef = useRef(null);
        const badgeRef = useRef(null);

        const format = (v) => (Number(v) || 0).toString().padStart(2, "0");

        const commitNow = (next) => {
          displayedRef.current = next;
          setDisplayed(next);
        };

        useEffect(() => {
          // Lần render đầu (mở / tải lại bảng điểm): hiện luôn, không animation
          if (isFirstRenderRef.current) {
            isFirstRenderRef.current = false;
            displayedRef.current = value;
            return;
          }

          // "Reset tất cả": huỷ mọi lần gom đang chờ, đổi số tức thì
          if (suppressAnimRef && suppressAnimRef.current) {
            clearTimeout(burstTimerRef.current);
            burstTimerRef.current = null;
            pendingAnimRef.current = null;
            commitNow(value);
            return;
          }

          // Bấm nhầm rồi bấm lại về đúng giá trị cũ -> huỷ luôn, không animation
          if (value === displayedRef.current) {
            clearTimeout(burstTimerRef.current);
            burstTimerRef.current = null;
            return;
          }

          // Còn trong chuỗi bấm -> lùi hẹn giờ, chờ thêm
          clearTimeout(burstTimerRef.current);
          burstTimerRef.current = setTimeout(() => {
            burstTimerRef.current = null;
            const from = displayedRef.current;
            pendingAnimRef.current = { from, to: value };
            commitNow(value);
          }, SCORE_BURST_MS);
        }, [value]);

        // Dọn hẹn giờ nếu component bị gỡ giữa chừng
        useEffect(() => () => clearTimeout(burstTimerRef.current), []);

        // Chạy animation sau khi số mới đã được render ra DOM
        useEffect(() => {
          const pending = pendingAnimRef.current;
          if (!pending) return;
          pendingAnimRef.current = null;

          const wrap = wrapRef.current;
          const el = numRef.current;
          if (!wrap || !el || typeof gsap === "undefined") return;

          const { from, to } = pending;
          const distance = wrap.clientHeight || el.clientHeight || 200;
          const dir = to >= from ? 1 : -1;

          // Dọn sạch phần còn sót của animation trước (nếu bấm dồn dập)
          gsap.killTweensOf(el);
          wrap
            .querySelectorAll("[data-score-ghost]")
            .forEach((old) => old.remove());

          // Bản sao của số cũ để trượt ra ngoài (React đã render số mới vào el)
          const ghost = el.cloneNode(true);
          ghost.setAttribute("data-score-ghost", "");
          ghost.textContent = format(from);
          wrap.appendChild(ghost);
          gsap.set(ghost, {
            position: "absolute",
            left: 0,
            right: 0,
            top: "50%",
            yPercent: -50,
            margin: 0,
            textAlign: "center",
            pointerEvents: "none",
          });
          gsap.to(ghost, {
            y: -distance * dir,
            opacity: 0,
            duration: 0.42,
            ease: "power3.inOut",
            onComplete: () => ghost.remove(),
          });
          gsap.fromTo(
            el,
            { y: distance * dir, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.42, ease: "power3.inOut" },
          );

          // Nhãn tổng điểm của pha vừa rồi
          const badge = badgeRef.current;
          const diff = to - from;
          if (badge && diff !== 0 && Math.abs(diff) <= MAX_BADGE_DELTA) {
            badge.textContent = (diff > 0 ? "+" : "−") + Math.abs(diff);
            badge.style.color = diff > 0 ? "#6ee787" : "#ff6b6b";
            gsap.killTweensOf(badge);
            gsap.fromTo(
              badge,
              { opacity: 1, y: 0, scale: 1 },
              {
                opacity: 0,
                y: -90,
                scale: 1.25,
                duration: 0.9,
                ease: "power2.out",
              },
            );
          }
        }, [displayed]);

        return (
          <React.Fragment>
            <div
              ref={wrapRef}
              className="relative flex w-full items-center justify-center overflow-hidden"
            >
              <h1 ref={numRef} className={fontSizeClass}>
                {format(displayed)}
              </h1>
            </div>
            <span
              ref={badgeRef}
              className="pointer-events-none absolute right-[28px] top-[24px] font-roboto text-[64px] opacity-0"
            />
          </React.Fragment>
        );
      };

      // Lớp phủ hội ý: mờ dần + phóng nhẹ khi hiện, và khi tắt thì chạy hết
      // animation rồi mới gỡ khỏi DOM. Nội dung được "đóng băng" lúc đang tắt để
      // tên đội / số giây không nhảy sang giá trị khác giữa chừng.
      const TimeoutOverlay = ({ show, scale, children }) => {
        const { useState, useEffect, useRef } = React;
        const [mounted, setMounted] = useState(show);
        const backdropRef = useRef(null);
        const panelRef = useRef(null);
        const frozenChildrenRef = useRef(children);

        if (show) frozenChildrenRef.current = children;

        useEffect(() => {
          if (show) {
            setMounted(true);
            return;
          }
          if (!mounted) return;
          if (typeof gsap === "undefined") {
            setMounted(false);
            return;
          }
          const tl = gsap.timeline({ onComplete: () => setMounted(false) });
          tl.to(
            panelRef.current,
            { opacity: 0, scale: 0.94, duration: 0.22, ease: "power2.in" },
            0,
          ).to(backdropRef.current, { opacity: 0, duration: 0.22 }, 0);
          return () => tl.kill();
        }, [show]);

        useEffect(() => {
          if (!mounted || !show) return;
          if (typeof gsap === "undefined") return;
          gsap.fromTo(
            backdropRef.current,
            { opacity: 0 },
            { opacity: 1, duration: 0.25, ease: "power2.out" },
          );
          gsap.fromTo(
            panelRef.current,
            { opacity: 0, scale: 0.92 },
            { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.4)" },
          );
        }, [mounted, show]);

        if (!mounted) return null;

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center">
            <div
              ref={backdropRef}
              className="absolute inset-0 bg-black bg-opacity-95"
            ></div>
            <div ref={panelRef} className="relative w-full h-[80%]">
              <div
                className="w-full h-full flex flex-col items-center justify-center bg-center bg-cover"
                style={{
                  transform: `scale(${scale / 100})`,
                  transformOrigin: "center",
                  backgroundImage:
                    "url('./assets/backgrounds/modal-background.png')",
                }}
              >
                {frozenChildrenRef.current}
              </div>
            </div>
          </div>
        );
      };

      const App = () => {
        const { useState, useEffect, useRef } = React;

        // Đọc dữ liệu đã lưu trong localStorage để hydrate lại bảng điểm khi tải trang
        // (ví dụ: mở scoreboard.html sau khi đã thiết lập tên đội/điểm ở remote)
        const readStoredJSON = (key, fallback) => {
          const raw = localStorage.getItem(key);
          if (raw === null) return fallback;
          try {
            return JSON.parse(raw);
          } catch (e) {
            return fallback;
          }
        };
        const readStoredString = (key, fallback) => {
          const raw = localStorage.getItem(key);
          return raw === null ? fallback : raw;
        };

        const [leagueLogo, setLeagueLogo] = useState(() =>
          readStoredString("leagueLogo", ""),
        );
        const [teamALogo, setTeamALogo] = useState(() =>
          readStoredString("teamALogo", ""),
        );
        const [teamBLogo, setTeamBLogo] = useState(() =>
          readStoredString("teamBLogo", ""),
        );
        const leagueLogoRef = useRef(null);
        const [teamAName, setTeamAName] = useState(() =>
          readStoredString("teamAName", ""),
        );
        const [teamBName, setTeamBName] = useState(() =>
          readStoredString("teamBName", ""),
        );
        const [teamAColor, setTeamAColor] = useState(() =>
          readStoredString("teamAColor", "white"),
        );
        const [teamBColor, setTeamBColor] = useState(() =>
          readStoredString("teamBColor", "white"),
        );
        const [timer, setTimer] = useState(() => readStoredJSON("timer", 0));
        const [shotClock, setShotClock] = useState(() =>
          readStoredJSON("shotClock", 24),
        );
        const [scoreAndFault, setScoreAndFault] = useState(() =>
          readStoredJSON("scoreAndFault", {
            teamAScore: 0,
            teamBScore: 0,
            teamAFaults: 0,
            teamBFaults: 0,
          }),
        );
        const [period, setPeriod] = useState(() => readStoredJSON("period", 1));
        const [overTime, setOverTime] = useState(() =>
          readStoredJSON("overTime", false),
        );
        // Possession arrow: "A" = đội trái, "B" = đội phải, null = chưa xác định
        const [possession, setPossession] = useState(() =>
          readStoredJSON("possession", null),
        );
        const [teamsTimeout, setteamsTimeout] = useState(() =>
          readStoredJSON("teamsTimeout", {
            teamATOUsed: 0,
            teamBTOUsed: 0,
          }),
        );
        const [totalTO, setTotalTO] = useState(() =>
          readStoredJSON("totalTO", 2),
        );
        const [timeOutClock, setTimeOutClock] = useState(() =>
          readStoredJSON("timeOutClock", 59),
        );
        const [isTeamATimingOut, setIsTeamATimingOut] = useState(() =>
          readStoredJSON("isTeamATimingOut", false),
        );
        const [isTeamBTimingOut, setIsTeamBTimingOut] = useState(() =>
          readStoredJSON("isTeamBTimingOut", false),
        );
        const [is5vs5, setIs5vs5] = useState(() =>
          readStoredJSON("is5vs5", true),
        );
        const [scoreboardScale, setScoreboardScale] = useState(() =>
          readStoredJSON("scoreboardScale", 100),
        );

        // Đưa bảng điểm về mặc định khi remote bấm "Reset tất cả".
        // Giữ nguyên is5vs5 và scoreboardScale (thuộc cấu hình hiển thị, không phải
        // dữ liệu trận) để tránh nháy đổi ảnh nền / cỡ hiển thị trên máy chiếu.
        // Bật cờ này để lần đổi điểm ngay sau reset không chạy animation
        const suppressAnimRef = useRef(false);
        useEffect(() => {
          // Chạy sau effect của component con -> hạ cờ khi ScoreBox đã đọc xong
          suppressAnimRef.current = false;
        });

        const resetAll = () => {
          suppressAnimRef.current = true;
          setLeagueLogo("");
          setTeamALogo("");
          setTeamBLogo("");
          setTeamAName("");
          setTeamBName("");
          setTeamAColor("white");
          setTeamBColor("white");
          setTimer(0);
          setShotClock(24);
          setScoreAndFault({
            teamAScore: 0,
            teamBScore: 0,
            teamAFaults: 0,
            teamBFaults: 0,
          });
          setPeriod(1);
          setOverTime(false);
          setPossession(null);
          setteamsTimeout({ teamATOUsed: 0, teamBTOUsed: 0 });
          setTotalTO(2);
          setTimeOutClock(59);
          setIsTeamATimingOut(false);
          setIsTeamBTimingOut(false);
        };

        useEffect(() => {
          const handleStorage = (event) => {
            // localStorage.clear() ở remote ("Reset tất cả") phát sự kiện với key = null
            if (event.key === null) {
              resetAll();
              return;
            }
            // console.log(event);
            switch (event.key) {
              case "leagueLogo":
                setLeagueLogo(localStorage.getItem("leagueLogo"));
                break;
              case "teamALogo":
                setTeamALogo(localStorage.getItem("teamALogo"));
                break;
              case "teamBLogo":
                setTeamBLogo(localStorage.getItem("teamBLogo"));
                break;
              case "teamAName":
                setTeamAName(localStorage.getItem("teamAName"));
                break;
              case "teamBName":
                setTeamBName(localStorage.getItem("teamBName"));
                break;
              case "teamAColor":
                setTeamAColor(localStorage.getItem("teamAColor"));
                break;
              case "teamBColor":
                setTeamBColor(localStorage.getItem("teamBColor"));
                break;
              case "timer":
                setTimer(parseInt(JSON.parse(localStorage.getItem("timer"))));
                break;
              case "shotClock":
                setShotClock(
                  parseInt(JSON.parse(localStorage.getItem("shotClock"))),
                );
                break;
              case "scoreAndFault":
                setScoreAndFault(
                  JSON.parse(localStorage.getItem("scoreAndFault")),
                );
                console.log(scoreAndFault);
                break;
              case "period":
                setPeriod(parseInt(JSON.parse(localStorage.getItem("period"))));
                break;
              case "overTime":
                setOverTime(JSON.parse(localStorage.getItem("overTime")));
                break;
              case "possession":
                setPossession(JSON.parse(localStorage.getItem("possession")));
                break;
              case "teamsTimeout":
                setteamsTimeout(
                  JSON.parse(localStorage.getItem("teamsTimeout")),
                );
                break;
              case "totalTO":
                setTotalTO(
                  parseInt(JSON.parse(localStorage.getItem("totalTO"))),
                );
                break;
              case "timeOutClock":
                setTimeOutClock(
                  parseInt(JSON.parse(localStorage.getItem("timeOutClock"))),
                );
                break;
              case "isTeamATimingOut":
                setIsTeamATimingOut(
                  JSON.parse(localStorage.getItem("isTeamATimingOut")),
                );
                break;
              case "isTeamBTimingOut":
                setIsTeamBTimingOut(
                  JSON.parse(localStorage.getItem("isTeamBTimingOut")),
                );
                break;
              case "is5vs5":
                setIs5vs5(JSON.parse(localStorage.getItem("is5vs5")));
                break;
              case "scoreboardScale":
                setScoreboardScale(
                  parseInt(JSON.parse(localStorage.getItem("scoreboardScale"))),
                );
                break;
            }
          };

          window.addEventListener("storage", handleStorage);
          return () => window.removeEventListener("storage", handleStorage);
        }, []);

        return (
          <div className="bg-black w-screen h-screen leading-none relative">
            <div
              style={{
                transform: `scale(${scoreboardScale / 100})`,
                transformOrigin: "top center",
                backgroundImage: is5vs5
                  ? `url('./assets/backgrounds/background5vs5.jpg')`
                  : `url('./assets/backgrounds/background3vs3.jpg')`,
              }}
              className="app-container w-full h-full bg-center bg-cover space-y-[20px] p-[20px] flex flex-col"
            >
              <div className="grid grid-cols-12 gap-[20px] flex-1 relative">
                <div className="col-span-3 flex items-center justify-center">
                  {teamALogo ? (
                    <img src={teamALogo} initialX={0} initialY={0} />
                  ) : (
                    <h1
                      className="text-white text-center text-[100px] font-roboto"
                      style={{ color: teamAColor }}
                    >
                      {teamAName}
                    </h1>
                  )}
                </div>
                <div className="col-span-6 flex flex-col items-center justify-center">
                  <div className="flex items-center justify-start p-[20px] w-full bg-[rgba(255,255,255,0.7)] flex-1">
                    <div className="logo flex flex-col items-center overflow-hidden justify-center">
                      <img
                        className="w-[200px] pb-[10px]"
                        src="./assets/logos/rg.png"
                      />
                      <img
                        className="w-[200px]"
                        src="./assets/logos/brsl.png"
                      />
                    </div>
                    <div ref={leagueLogoRef} className="w-full h-full">
                      {leagueLogo && (
                        <LogoTeam
                          src={leagueLogo}
                          initialX={0}
                          initialY={0}
                          parentRef={leagueLogoRef}
                        />
                      )}
                    </div>
                  </div>
                  <div className="flex items-center justify-center text-[250px] font-roboto text-white bg-[#9393934d] w-full p-[20px]">
                    {String(Math.floor(timer / 60)).padStart(2, "0")}:
                    {String(timer % 60).padStart(2, "0")}
                  </div>
                </div>
                <div className="col-span-3 flex items-center overflow-hidden justify-center">
                  {teamBLogo ? (
                    <img src={teamBLogo} initialX={0} initialY={0} />
                  ) : (
                    <h1
                      className="text-white text-center text-[100px] font-roboto"
                      style={{ color: teamBColor }}
                    >
                      {teamBName}
                    </h1>
                  )}
                </div>
              </div>

              <div className="grid grid-cols-12 gap-[20px] flex-1">
                <div className="col-span-4 team-a-info flex flex-col justify-center items-center gap-[20px] text-white font-roboto">
                  <div className="relative w-full h-full border-2 border-white rounded-[10px] flex flex-col justify-center items-center px-[10px]">
                    <h3
                      className="text-center text-[40px] pb-[20px]"
                      style={{ color: teamAColor }}
                    >
                      {teamALogo ? (teamAName ? teamAName : "") : ""}
                    </h3>
                    <ScoreBox
                      value={scoreAndFault.teamAScore}
                      fontSizeClass="text-[380px]"
                      suppressAnimRef={suppressAnimRef}
                    />
                  </div>
                </div>
                <div className="col-span-4 flex flex-col space-y-[10px]">
                  <div className="w-full flex items-center justify-center flex-1">
                    <div
                      className="font-roboto text-[170px] bg-[#9393934d] rounded-[10px] py-[10px] h-full w-full px-[20px] flex items-center justify-between gap-[10px]"
                      style={{ color: shotClock <= 5 ? "red" : "white" }}
                    >
                      <img
                        src="./assets/icons/left-triangle.png"
                        alt=""
                        className="h-[90px] w-auto shrink-0"
                        style={{ opacity: possession === "A" ? 1 : 0.2 }}
                      />
                      <span className="flex-1 text-center">{shotClock}</span>
                      <img
                        src="./assets/icons/right-triangle.png"
                        alt=""
                        className="h-[90px] w-auto shrink-0"
                        style={{ opacity: possession === "B" ? 1 : 0.2 }}
                      />
                    </div>
                  </div>
                  <div className="fault-and-to text-white font-roboto border-2 border-white rounded-[10px]">
                    <div className="w-full flex">
                      <div className="border-r-2 border-white flex flex-col w-1/2 pt-[10px] justify-evenly">
                        <div className="team-a-f text-center">
                          <h3 className="text-[40px]">LỖI</h3>
                          <div className="text-[90px] flex items-center justify-center w-full border-b-2 border-white">
                            <div className="">{scoreAndFault.teamAFaults}</div>
                          </div>
                          <div className="text-white text-[20px] font-roboto h-full w-full my-[10px]">
                            Hội ý {teamsTimeout.teamATOUsed}/{totalTO}
                          </div>
                        </div>
                      </div>
                      <div className="period flex flex-col text-white font-roboto w-full text-center p-[10px] text-[30px] border-r-2 border-white">
                        {!overTime ? (
                          <h1 className="w-full">
                            HIỆP{" "}
                            <div className="text-[120px] pt-[10px]">
                              {period}
                            </div>
                          </h1>
                        ) : (
                          <h1 className="w-full">
                            HIỆP PHỤ{" "}
                            <div className="text-[120px] pt-[10px]">
                              {period}
                            </div>
                          </h1>
                        )}
                      </div>
                      <div className="flex flex-col w-1/2 pt-[10px] justify-evenly">
                        <div className="team-b-f text-center">
                          <h3 className="text-[40px]">LỖI</h3>
                          <div className="text-[90px] flex items-center justify-center w-full border-b-2 border-white">
                            <div className="">{scoreAndFault.teamBFaults}</div>
                          </div>
                          <div className="text-white text-[20px] font-roboto my-[10px]">
                            Hội ý {teamsTimeout.teamBTOUsed}/{totalTO}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div className="col-span-4 team-b-info flex flex-col justify-center items-center gap-[20px] text-white font-roboto">
                  <div className="relative w-full h-full border-2 border-white rounded-[10px] flex flex-col justify-center items-center px-[10px]">
                    <h3
                      className="text-center text-[40px] pb-[20px]"
                      style={{ color: teamBColor }}
                    >
                      {teamBLogo ? (teamBName ? teamBName : "") : ""}
                    </h3>
                    <ScoreBox
                      value={scoreAndFault.teamBScore}
                      fontSizeClass="text-[350px]"
                      suppressAnimRef={suppressAnimRef}
                    />
                  </div>
                </div>
              </div>
            </div>
            <TimeoutOverlay
              show={isTeamATimingOut || isTeamBTimingOut}
              scale={scoreboardScale}
            >
                  <div className="text-white text-center w-full h-full p-[40px] flex flex-col space-y-[20px] font-roboto">
                    <h1 className="text-center w-full text-[120px]">{isTeamATimingOut ? teamAName : teamBName}</h1>
                    <div className="flex items-center justify-center grid grid-cols-12 flex-1">
                      <div className="col-span-4 flex flex-col items-center justify-center space-y-[20px]">
                        <img src={teamALogo} className="w-[160px] h-auto" />
                        <h3 className="text-[300px]">
                          {scoreAndFault.teamAScore.toString().padStart(2, "0")}
                        </h3>
                      </div>
                      <div className="col-span-4 text-center space-y-[10px]">
                        <h2 className="text-[250px]">{timeOutClock}</h2>
                        <h2 className="text-[40px]">
                          Lượt{" "}
                          {isTeamATimingOut
                            ? `${teamsTimeout.teamATOUsed}/${totalTO}`
                            : `${teamsTimeout.teamBTOUsed}/${totalTO}`}{" "}
                        </h2>
                      </div>
                      <div className="col-span-4 flex flex-col items-center justify-center space-y-[20px]">
                        <img src={teamBLogo} className="w-[160px] h-auto" />
                        <h3 className="text-[300px]">
                          {scoreAndFault.teamBScore.toString().padStart(2, "0")}
                        </h3>
                      </div>
                    </div>
                  </div>
            </TimeoutOverlay>
          </div>
        );
      };

      const LogoTeam = ({ src, initialX, initialY, parentRef }) => {
        const { useState, useEffect, useRef } = React;

        const [position, setPosition] = useState({ x: initialX, y: initialY });
        const [scale, setScale] = useState(1);
        const [dragging, setDragging] = useState(false);
        const offset = useRef({ x: 0, y: 0 });

        const handleMouseDown = (e) => {
          setDragging(true);
          offset.current = {
            x: e.clientX - position.x,
            y: e.clientY - position.y,
          };
        };

        const handleMouseMove = (e) => {
          if (!dragging) return;
          setPosition({
            x: e.clientX - offset.current.x,
            y: e.clientY - offset.current.y,
          });
        };

        const handleMouseUp = () => setDragging(false);

        const handleWheel = (e) => {
          e.preventDefault();
          const delta = -e.deltaY;
          const factor = delta > 0 ? 0.05 : -0.05;
          setScale((prev) => Math.max(0.1, prev + factor));
        };

        useEffect(() => {
          window.addEventListener("mousemove", handleMouseMove);
          window.addEventListener("mouseup", handleMouseUp);
          return () => {
            window.removeEventListener("mousemove", handleMouseMove);
            window.removeEventListener("mouseup", handleMouseUp);
          };
        }, [dragging]);

        return (
          <img
            src={src}
            alt="Draggable"
            className="absolute cursor-move select-none"
            onMouseDown={handleMouseDown}
            onWheel={handleWheel}
            style={{
              top: position.y,
              left: position.x,
              transform: `scale(${scale})`,
              transformOrigin: "top left",
            }}
          />
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
