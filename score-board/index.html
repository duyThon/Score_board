<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard Remote</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mui/material@5.15.12/dist/material.min.css">
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@mui/material@5.15.12/umd/material-ui.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

const { useState, useEffect, useRef } = React;

const { Grid, Button, Stack, TextField } = MaterialUI;

    const App = () => {

      useEffect(() => {
        localStorage.setItem("logoLeague","")
        localStorage.setItem("logoTeamA","")
        localStorage.setItem("logoTeamB","")
        localStorage.setItem("timer","")
        localStorage.setItem("shotClock","")
        localStorage.setItem("scoreAndFault","")
        localStorage.setItem("isLeft","")
        localStorage.setItem("period","")
        localStorage.setItem("totalConsult","")
      }, [])

      return (
        <>
          <Remote/>
        </>
      )
    }

    const Timer = ({ isRunning, handleClock }) => {
      const [inputValue, setInputValue] = useState('');
      const [time, setTime] = useState(0);
      // const [isRunning, setIsRunning] = useState(false);
      const intervalRef = useRef(null);
      
      useEffect(() => {
        let timerFormat = `${String(Math.floor(time / 60)).padStart(2, '0')}:${String(time % 60).padStart(2, '0')}`
        localStorage.setItem("timer",JSON.stringify(timerFormat))
      })

      useEffect(() => {
        if(time == 0 && isRunning) {
          playTimeOutSound();
        }
      },[time])
      
      const handleKeyDown = (event) => {
        if (event.code === "Numpad3") {
          handleTimerClick();
        }
      };

      useEffect(() => {
        window.addEventListener("keydown", handleKeyDown);

        return () => {
          window.removeEventListener("keydown", handleKeyDown);
        };
      });

      useEffect(() => {
        if (isRunning) {
          intervalRef.current = setInterval(() => {
            setTime((prev) => {
              if (prev <= 0) {
                clearInterval(intervalRef.current);
                handleClock(false);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          clearInterval(intervalRef.current);
        }

        return () => clearInterval(intervalRef.current);
      }, [isRunning]);

      const handleInput = (e) => {
        const value = e.target.value.replace(/\D/g, '').slice(0, 4);
        setInputValue(value);
        const seconds = parseInt(value.slice(-2), 10) || 0;
        const minutes = parseInt(value.slice(0, -2), 10) || 0;
        setTime(minutes * 60 + seconds);
      };

      const handleTimerClick = () => {
        if (time > 0 && isRunning) {
          handleClock(false);
        } else if (time > 0 && !isRunning) {
          handleClock(true);
        }
      }

      const playTimeOutSound = () => {
        const audio = new Audio('./assets/sounds/Buzzer.mp3');
        audio.play();
      }

      return (
        <div style={{ textAlign: "center"}}>
          <input
            type="text"
            value={inputValue}
            onChange={handleInput}
            placeholder="Nhập thời gian (00:00)"
            style={{
              fontSize: "40px",
              textAlign: "center",
              margin: "17px 30px 0px",
              width: "593px",
            }}
          />
          <div onClick={handleTimerClick} className="text" style={{width: "420px", fontSize: "150px", margin: "auto", marginTop: "-15px", cursor: "pointer"}}>
            <div style={{
                  color: isRunning ? "#61ff61" : "white"
                }}>
              {String(Math.floor(time / 60)).padStart(2, '0')}:
              {String(time % 60).padStart(2, '0')}
            </div>
          </div>
        </div>
      );
    };

    const ShotClock = ({ isRunning }) => {
      const [time, setTime] = useState(24);
      const [editingTime, setEditingTime] = useState(null);
      
      useEffect(() => {
        localStorage.setItem("shotClock", JSON.stringify(time))
      })

      useEffect(() => {
        if(time == 0 && isRunning) {
          playSound();
        }
      },[time])

      const handleKeyDown = (event) => {
        switch (event.code) {
          // case "Numpad3" :
          //   handleClockClick();
          //   break;

          case "Numpad2" :
            handleSwitch(24);
            break;

          case "Numpad1" :
            handleSwitch(14);
            break;
        }
      };

      useEffect(() => {
        window.addEventListener("keydown", handleKeyDown);

        return () => {
          window.removeEventListener("keydown", handleKeyDown);
        };
      });

      useEffect(() => {
        let interval = null;
        if (isRunning) {
          interval = setInterval(() => {
            setTime((prev) => {
              if (prev <= 1) {
                // clearInterval(interval);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [isRunning]);

      // const handleClockClick = () => {
      //   if (time > 0) setIsRunning((prev) => !prev);
      // };

      const handleSwitch = (time) => {
        // setIsRunning(true);
        if (time == 24) {
          setTime(24);
        } else if(time == 14) setTime(14);
      };

      const handleTimeSave = () => {
        const newTime = parseInt(time, 10);
        if (!isNaN(newTime) && newTime >= 0) {
          setTime(newTime);
        }
        setEditingTime(null);
      }

      const playSound = () => {
        const audio = new Audio('./assets/sounds/Horn.mp3');
        audio.play();
      }

      return (
        <div style={{ textAlign: "center", marginTop: "-27px" }}>
            {editingTime && !isRunning ? (
              <TextField
                value={time}
                onChange={(e) => setTime(e.target.value.replace(/\D/g, ""))}
                onBlur={handleTimeSave}
                autoFocus
                variant="filled"
                color="success"
                style={{
                  height: "200px",
                  width: "200px",
                  marginLeft: "156px",
                  marginTop: "0"
                }}
                className="score-input"
                inputProps={{ style: { fontSize: "112px", textAlign: "center", color: "white" }, maxLength: 2 }}
              />
            ) : (<h1  className="text twenty-four" style={{
              cursor: "pointer",
              width: "180px",
              textAlign: "center",
              margin: "auto",
              color: isRunning ? "#61ff61" : "white",
              zIndex:"99"
            }}
            onClick={() => setEditingTime(true)}
            >
              {time}
            </h1>)}
          <Button
            className="remote-btn"
            variant="outlined"
            onClick={() => handleSwitch(24)}
            style={{
              position: "absolute",
              top: "217px",
              right: "452px",
              padding: "10px 24px"
            }}
          >
            24s
          </Button>
          <Button
            className="remote-btn"
            variant="outlined"
            onClick={() => handleSwitch(14)}
            style={{
              position: "absolute",
              top: "266px",
              right: "452px",
              padding: "10px 24px"
            }}
          >
            14s
          </Button>
          
        </div>
      );
    };

    const UploadLogoButton = () => {
      const [image, setImage] = useState(null);

      const handleUpload = (event) => {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = () => {
            const base64 = reader.result;
            localStorage.setItem("logoLeague", base64);
            setImage(base64);
          };
          reader.readAsDataURL(file);
        }
      };

      return (
        <div style={{ textAlign: "center", padding: "40px"}}>
          {image ? 
            <div style={{position: "fixed", top: "150px", right: "70px" }}>
            <img
              className="logo-remote"
              src={image}
              style={{
              }}
            />
            <input
              accept="image/*"
              type="file"
              id="upload-button"
              style={{ display: "none" }}
              onChange={handleUpload}
            />
            <label htmlFor="upload-button">
              <Button
                className="remote-btn"
                variant="outlined"
                component="span"
                style={{
                  padding: "10px 20px",
                  fontSize: "16px",
                  textTransform: "none",
                }}
              >
                Nhầm ảnh rồi tải ảnh khác
              </Button>
            </label>
          </div>
            :
              <>
                <input
                  accept="image/*"
                  type="file"
                  id="upload-button"
                  style={{ display: "none" }}
                  onChange={handleUpload}
                />
                <label htmlFor="upload-button">
                  <Button
                    className="remote-btn"
                    variant="outlined"
                    component="span"
                    style={{
                      padding: "10px 20px",
                      fontSize: "16px",
                      textTransform: "none",
                    }}
                  >
                    Logo Giải
                  </Button>
                </label>
              </>
          }
        </div>
      );
    };

    const TeamsLogo = () => {
      const [logoTeamA, setLogoTeamA] = useState(null);
      const [logoTeamB, setLogoTeamB] = useState(null);

      const handleUploadTeamA = (event) => {
        const file = event.target.files[0];
        if (file) {
          
          setLogoTeamA(URL.createObjectURL(file));
          localStorage.setItem("logoTeamA",JSON.stringify(URL.createObjectURL(file)))
        }
        if (file) {
          const reader = new FileReader();
          reader.onload = () => {
            const base64 = reader.result;
            localStorage.setItem("logoTeamA", base64);
            setLogoTeamA(base64);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleUploadTeamB = (event) => {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = () => {
            const base64 = reader.result;
            localStorage.setItem("logoTeamB", base64);
            setLogoTeamB(base64);
          };
          reader.readAsDataURL(file);
        }
      };

      return (
        <div className="teams-logo-remote">
          <Grid container spacing={0.5}>
            <Grid item md={4}>
              {logoTeamA ? 
                <div className="team-a-remote">
                  <img
                  src={logoTeamA}
                  />
                  <input
                    accept="image/*"
                    type="file"
                    id="upload-logo-team-1"
                    style={{ display: "none" }}
                    onChange={handleUploadTeamA}
                  />
                  <label htmlFor="upload-logo-team-1">
                    <Button
                      className="remote-btn"
                      variant="outlined"
                      component="span"
                      style={{
                        padding: "10px 20px",
                        fontSize: "16px",
                        textTransform: "none",
                      }}
                    >
                      Đổi lại
                    </Button>
                  </label>
                </div>
              :
                <>
                  <input
                    accept="image/*"
                    type="file"
                    id="upload-logo-team-1"
                    style={{ display: "none" }}
                    onChange={handleUploadTeamA}
                  />
                  <label htmlFor="upload-logo-team-1">
                    <Button
                      className="remote-btn"
                      variant="outlined"
                      component="span"
                      style={{
                        padding: "10px 20px",
                        fontSize: "16px",
                        textTransform: "none",
                      }}
                    >
                      Tải logo đội 1
                    </Button>
                  </label>
                </>
              }
            </Grid>
            <Grid item md={4}>
            </Grid>
            <Grid item md={4}>
            {logoTeamB ? 
                <div className="team-b-remote">
                  <img
                  src={logoTeamB}
                  />
                  <input
                    accept="image/*"
                    type="file"
                    id="upload-logo-team-2"
                    style={{ display: "none" }}
                    onChange={handleUploadTeamB}
                  />
                  <label htmlFor="upload-logo-team-2">
                    <Button 
                      className="remote-btn"
                      variant="outlined"
                      component="span"
                      style={{
                        padding: "10px 20px",
                        fontSize: "16px",
                        textTransform: "none",
                      }}
                    >
                      Đổi lại
                    </Button>
                  </label>
                </div>
              :
                <>
                  <input
                    accept="image/*"
                    type="file"
                    id="upload-logo-team-2"
                    style={{ display: "none" }}
                    onChange={handleUploadTeamB}
                  />
                  <label htmlFor="upload-logo-team-2">
                    <Button
                      className="remote-btn"
                      variant="outlined"
                      component="span"
                      style={{
                        padding: "10px 20px",
                        fontSize: "16px",
                        textTransform: "none",
                      }}
                    >
                      Tải logo đội 2
                    </Button>
                  </label>
                </>
              }
            </Grid>
          </Grid>
        </div>
      )
    }

    const TeamsName = () => {
      const [teamAName, setTeamAName] = useState("");
      const [teamBName, setTeamBName] = useState("");

      useEffect(() => {
        localStorage.setItem("teamAName", JSON.stringify(teamAName));
        localStorage.setItem("teamBName", JSON.stringify(teamBName));
      })

      return (
        <div className="teams-name-remote">
        <input className="score-input" placeholder="Nhập tên đội A" value={teamAName} onChange={(e) => setTeamAName(e.target.value)} label="Đội A" variant="filled" />
        <input className="score-input" placeholder="Nhập tên đội B" value={teamBName} onChange={(e) => setTeamBName(e.target.value)} label="Đội B" variant="filled" />
        </div>
      )
    }
    
    const ScoreAndFault = ({ faults, handleFaults }) => {
      const [teamAScore, setTeamAScore] = useState(0);
      const [teamBScore, setTeamBScore] = useState(0);
      const [editingTeam, setEditingTeam] = useState(null);
      const [tempScore, setTempScore] = useState("");

      useEffect(() => {
        let scores = {
          teamAScore,
          teamBScore
        }
        localStorage.setItem("scores", JSON.stringify(scores))
        localStorage.setItem("faults", JSON.stringify(faults))
      })

      const handleKeyDown = (event) => {
        switch (event.code) {
          case "Numpad7" :
            handleIncrement("A", 1);
            break;

          case "Numpad8" :
            handleIncrement("A", -1);
            break;

          case "Numpad4" :
            handleIncrement("B", 1);
            break;

          case "Numpad5" :
            handleIncrement("B", -1);
            break;
        }
      };

      useEffect(() => {
        window.addEventListener("keydown", handleKeyDown);

        return () => {
          window.removeEventListener("keydown", handleKeyDown);
        };
      });

      const handleScoreClick = (team) => {
        setEditingTeam(team);
        setTempScore(team === "A" ? teamAScore : teamBScore);
      };

      const handleScoreSave = () => {
        const newScore = parseInt(tempScore, 10);
        if (!isNaN(newScore) && newScore >= 0) {
          if (editingTeam === "A") setTeamAScore(newScore);
          if (editingTeam === "B") setTeamBScore(newScore);
        }
        setEditingTeam(null);
      };

      const handleIncrement = (team, increment) => {
        if (team === "A") setTeamAScore((prev) => prev + increment);
        if (team === "B") setTeamBScore((prev) => prev + increment);
      };
      return (
        <>
          <Grid item md={4}>
            {editingTeam === "A" ? (
              <TextField
                value={tempScore}
                onChange={(e) => setTempScore(e.target.value.replace(/\D/g, ""))}
                onBlur={handleScoreSave}
                autoFocus
                variant="filled"
                color="success"
                style={{
                  height: "200px",
                  width: "200px",
                  marginLeft: "156px",
                  marginTop: "-20px"
                }}
                className="score-input"
                inputProps={{ style: { fontSize: "160px", textAlign: "center", color: "white" }, maxLength: 2 }}
              />
            ) : (
              <h1
                className="text score"
                style={{
                  fontSize: "160px",
                  cursor: "pointer",
                  width: "200px",
                  margin: "auto",
                }}
                onClick={() => handleScoreClick("A")}
              >
                {teamAScore.toString().padStart(2, '0')}
              </h1>
            )}
            <Stack direction="row" spacing={2} justifyContent="center" marginTop="10px">
              <Button
                className="remote-btn"
                variant="outlined"
                onClick={() => handleIncrement("A", -1)}
              >
                -1
              </Button>
              <Button
                className="remote-btn"
                variant="outlined"
                onClick={() => handleIncrement("A", 1)}
              >
                +1
              </Button>
            </Stack>
          </Grid>

          <Grid item md={2}>
            <div className="consult-fault">
              <div style={{margin: "61px 6px 0", display: "flex", flexDirection: "row-reverse"}} className="fault">
                <Stack spacing={2}
                  style={{
                    marginTop: "20px"
                  }}
                  sx={{
                    justifyContent: "flex-start",
                    alignItems: "flex-end",
                  }}
                >
                  <Button
                    className="remote-btn"
                    variant="outlined"
                    onClick={() => handleFaults("A", -1)}
                  >
                    -1
                  </Button>
                  <Button
                    className="remote-btn"
                    variant="outlined"
                    onClick={() => handleFaults("A", 1)}
                  >
                    +1
                  </Button>
                </Stack>
                <div>
                  <div className="text">LỖI</div>
                  <div className="text fault-numb">{faults.teamAFaults}</div>
                </div>
              </div>
            </div>
          </Grid>
          <Grid item md={2}>
            <div className="consult-fault">
              <div style={{margin: "61px 6px 0", display: "flex", flexDirection: "row"}} className="fault">
                <Stack spacing={2}
                  style={{
                    marginTop: "20px"
                  }}
                  sx={{
                    justifyContent: "flex-start",
                    alignItems: "flex-end",
                  }}
                >
                  <Button
                    className="remote-btn"
                    variant="outlined"
                    onClick={() => handleFaults("B", -1)}
                  >
                    -1
                  </Button>
                  <Button
                    className="remote-btn"
                    variant="outlined"
                    onClick={() => handleFaults("B", 1)}
                  >
                    +1
                  </Button>
                </Stack>
                <div>
                  <div className="text">LỖI</div>
                  <div className="text fault-numb">{faults.teamBFaults}</div>
                </div>
              </div>
            </div>
          </Grid>
          <Grid item md={4}>
            {editingTeam === "B" ? (
              <TextField
                value={tempScore}
                onChange={(e) => setTempScore(e.target.value.replace(/\D/g, ""))}
                onBlur={handleScoreSave}
                autoFocus
                variant="filled"
                color="success"
                style={{
                  height: "200px",
                  width: "200px",
                  marginLeft: "156px",
                  marginTop: "0"
                }}
                className="score-input"
                inputProps={{ style: { fontSize: "160px", textAlign: "center", color: "white" }, maxLength: 2 }}
              />
            ) : (
              <h1
                className="text score"
                style={{
                  fontSize: "160px",
                  cursor: "pointer",
                  width: "200px",
                  margin: "auto",
                }}
                onClick={() => handleScoreClick("B")}
              >
                {teamBScore.toString().padStart(2, '0')}
              </h1>
            )}
            <Stack direction="row" spacing={2} justifyContent="center" marginTop="10px">
              <Button
                className="remote-btn"
                variant="outlined"
                onClick={() => handleIncrement("B", -1)}
              >
                -1
              </Button>
              <Button
                className="remote-btn"
                variant="outlined"
                color="primary"
                onClick={() => handleIncrement("B", 1)}
              >
                +1
              </Button>
            </Stack>
          </Grid>
        </>
      )
    }

    const TimeOut = ({ period }) => {
      const [timeOutClock, setTimeOutClock] = useState(59);

      const [isTeamATimingOut, setIsTeamATimingOut] = useState(false);
      const [isTeamBTimingOut, setIsTeamBTimingOut] = useState(false);

      const [teamATOTotal, setTeamATOTotal] = useState(2);
      const [teamATOUsed, setTeamATOUsed] = useState(0);

      const [teamBTOTotal, setTeamBTOTotal] = useState(2);
      const [teamBTOUsed, setTeamBTOUsed] = useState(0);

      const [intervalId, setIntervalId] = useState(null);


      useEffect(() => {
        setTeamATOUsed(0)
        setTeamBTOUsed(0)
        if( period > 2 ) {
          setTeamATOTotal(3)
          setTeamBTOTotal(3)
        } else {
          setTeamATOTotal(2)
          setTeamBTOTotal(2)
        }
      },[period])

      useEffect(() => {
        localStorage.setItem("timeOutClock",JSON.stringify(timeOutClock))
      },[timeOutClock])
      
      useEffect(() => {
        localStorage.setItem("isTeamATimingOut",JSON.stringify(isTeamATimingOut))
      },[isTeamATimingOut])

      useEffect(() => {
        localStorage.setItem("isTeamBTimingOut",JSON.stringify(isTeamBTimingOut))
      },[isTeamBTimingOut])

      const handleTimeOut = (team, increment) => {
        if (team === "A" && increment == 1) {
          if(teamATOUsed < teamATOTotal) {
            setTimeOutClock(10);
            setIsTeamATimingOut(true)
            setTeamATOUsed((prev) => prev + increment)
            const id = setInterval(() => {
              setTimeOutClock((prev) => {
                if (prev === 1) {
                  clearInterval(id);
                  setIsTeamATimingOut(false);
                  playTOSound();
                  return null;
                }
                return prev - 1;
              });
            }, 1000);
            setIntervalId(id);
          }
        } else if (team === "A" && increment == -1) {
          if(teamATOUsed > 0) setTeamATOUsed((prev) => prev + increment)
        }

        if (team === "B" && increment == 1) {
          if(teamBTOUsed < teamBTOTotal) {
            setTimeOutClock(59);
            setIsTeamBTimingOut(true)
            setTeamBTOUsed((prev) => prev + increment)
            const id = setInterval(() => {
              setTimeOutClock((prev) => {
                if (prev === 1) {
                  clearInterval(id);
                  setIsTeamBTimingOut(false);
                  playTOSound();
                  return null;
                }
                return prev - 1;
              });
            }, 1000);
            setIntervalId(id);
          }
        } else if (team === "B" && increment == -1) {
          if(teamBTOUsed > 0) setTeamBTOUsed((prev) => prev + increment)
        }
      }

      const stopTO = (team) => {
        clearInterval(intervalId);
        if(team == "A") setIsTeamATimingOut(false);
        if(team == "B") setIsTeamBTimingOut(false);
      }

      const playTOSound = () => {
        const audio = new Audio('./assets/sounds/Buzzer.mp3');
        audio.play();
      }

      return (
        <>
          <Grid item md={4} />
          <Grid item md={2}>
            <div className="timeout">
              <div style={{margin: "6px 41px 0px", width: "100%"}}>
                <Stack direction="row" spacing={2}>
                  <button className="time-out-button" onClick={() => handleTimeOut("A", -1)}>-1</button>
                  <span className="text" style={{ marginTop: "5px" }}>Hội ý {teamATOUsed}/{teamATOTotal}</span>
                  {isTeamATimingOut && <span className="text" style={{ marginTop: "5px" }}>{timeOutClock}s</span>}
                    { isTeamATimingOut ? 
                        <button className="time-out-button" onClick={() =>stopTO("A")}><img src="./assets/icons/stop.png"/></button> 
                      : <button className="time-out-button" onClick={() => handleTimeOut("A", 1)}>+1</button>
                    }
                </Stack>
              </div>
            </div>
          </Grid>
          <Grid item md={2}>
            <div className="timeout">
              <div style={{margin: "6px 15px 0px", width: "100%"}}>
                <Stack direction="row" spacing={2}>
                  <button className="time-out-button" onClick={() => handleTimeOut("A", -1)}>-1</button>
                  <span className="text" style={{ marginTop: "5px" }}>Hội ý {teamBTOUsed}/{teamBTOTotal}</span>
                  {isTeamBTimingOut && <span className="text" style={{ marginTop: "5px" }}>{timeOutClock}</span>}
                    { isTeamBTimingOut ? 
                        <button className="time-out-button" onClick={() =>stopTO("B")}><img src="./assets/icons/stop.png"/></button> 
                      : <button className="time-out-button" onClick={() => handleTimeOut("B", 1)}>+1</button>
                    }
                </Stack>
              </div>
            </div>
          </Grid>
          <Grid item md={4} />
        </>
      )
    }

    const Period = ({ period, handlePeriod }) => {
      const [totalConsult, setTotalConsult] = useState(2);
      const [ConsultTeamA, setConsultTeamA] = useState(0);
      const [ConsultTeamB, setConsultTeamB] = useState(0);
      const [overTime, setOverTime] = useState(false);

      useEffect(() => {
        localStorage.setItem("period", JSON.stringify(period))
        localStorage.setItem("overTime", JSON.stringify(overTime))
      })

      useEffect(() => {
        if(period <= 2) {
          setTotalConsult(2)
        } else {
          setTotalConsult(3)
        }
        localStorage.setItem("totalConsult", JSON.stringify(totalConsult))
      })

      return (
        <>
          <div className="period-remote">
            { !overTime ? <h1 style={{cursor: "pointer"}} className="text" onClick={handlePeriod}>HIỆP <span>{period}</span></h1>
              : <h1 className="text" style={{cursor: "pointer", marginLeft:"60px"}} onClick={handlePeriod}>HIỆP PHỤ <span>{period}</span></h1>
            }
          </div>
          <Button
            style={{
              bottom: "260px",
              left: "468px",
              width: "50px",
              cursor: "pointer",
              fontSize: "26px"
            }}
            className="remote-btn"
            variant="outlined"
            onClick={() => setOverTime((pre) => !pre)}
          >
            OT
          </Button>
        </>
      )
    }

    const Possession = () => {
      const [isLeft, setIsLeft] = useState(true)

      const handleKeyDown = (event) => {
        if (event.code === "ArrowRight") {
          setIsLeft(true)
        } else if (event.code == "ArrowLeft") {
          setIsLeft(false)
        }
      };

      useEffect(() => {
        window.addEventListener("keydown", handleKeyDown);

        return () => {
          window.removeEventListener("keydown", handleKeyDown);
        };
      });

      const handleSwitch = () => {
        setIsLeft((prev) => !prev)
        localStorage.setItem("isLeft",JSON.stringify(isLeft))
      }

      return (
        <div>
          <img className="possession-remote" onClick={handleSwitch} src="./assets/icons/arrow.png" />
          <div className="triangle-remote">
            <img className="triangle-left" src="./assets/icons/triangle.png"
              style={{
                opacity: isLeft ? 0.3 : 1,
                transition: "opacity 0.3s ease",
              }}
            />
            <img className="triangle-right" src="./assets/icons/triangle.png"
              style={{
                opacity: !isLeft ? 0.3 : 1,
                transition: "opacity 0.3s ease",
              }}
            />
          </div>
        </div>
      )
    }

    const Remote = () => {

      const [isRunning,setIsRunning] = useState(false)

      const [faults, setFaults] = useState({
        teamAFaults: 0,
        teamBFaults: 0
      })

      const [period, setPeriod] = useState(1)

      const [TOTimer, setTOTimer] = useState(0)

      const handleClock = (value) => {
        setIsRunning(value);
      }

      const handleFaults = (team, increment) => {
        if (team === "A") {
          setFaults(prev => ({
              ...prev,
              teamAFaults: faults.teamAFaults + increment
          }));
        }
        if (team === "B") {
          setFaults(
            (prev) => ({
              ...prev,
              teamBFaults: faults.teamBFaults + increment
            })
          );
        }
      }

      const handlePeriod = () => {
        if(period < 4) {
          setPeriod((pre) => pre + 1)
        } else {
          setPeriod((pre) => pre = 1)
        }
      }

      const openNewTab = () => {
        window.open("scoreboard.html","_blank");
      }

      return (
        <>
          <Grid container spacing={0.5}>
            <Grid item md={3}></Grid>

            <Grid item md={6}>
              <Timer isRunning={isRunning} handleClock={handleClock}/>
            </Grid>
            <Grid item md={3}>
              <UploadLogoButton/>
            </Grid>
          </Grid>

          <TeamsLogo/>
          <TeamsName/>
          
          
          
          <Grid container spacing={0.5}>
            <Grid item md={3}>
              
            </Grid>
            <Grid item md={6}>
              <ShotClock isRunning={isRunning}/>
            </Grid>
            <Grid item md={3}>
              
            </Grid>
          </Grid>

          <Grid container spacing={0.5}>
            <ScoreAndFault faults={faults} handleFaults={handleFaults}/>
            <TimeOut period={period} />
          </Grid>

          <Period period={period} handlePeriod={handlePeriod}/>
          <div
            className="open-new-tab-btn">
            <Button
              variant="contained"
              onClick={openNewTab}
            >
            Mở bảng điểm
          </Button></div>
        </>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    </script>
  </body>
</html>
