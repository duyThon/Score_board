<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mui/material@5.15.12/dist/material.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Roboto", serif;
            font-optical-sizing: auto;
            font-weight: 800;
        }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@mui/material@5.15.12/umd/material-ui.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { Grid, Button, Stack, TextField} = MaterialUI;

        
        const Scoreboard = () => {

            const [logoLeague, setLogoLeague] = useState("");
            const [logoTeamA, setLogoTeamA] = useState("");
            const [logoTeamB, setLogoTeamB] = useState("");
            const [teamAName, setTeamAName] = useState("");
            const [teamBName, setTeamBName] = useState("");
            const [timer, setTimer] = useState("");
            const [shotClock, setShotClock] = useState("");
            const [scores, setScores] = useState("");
            const [faults, setFaults] = useState("");
            const [isLeft, setIsLeft] = useState("");
            const [period, setPeriod] = useState("1");
            const [overTime, setOverTime] = useState("");
            const [totalConsult, setTotalConsult] = useState("");
            const [timeOutClock, setTimeOutClock] = useState(null);
            const [isTeamATimingOut, setIsTeamATimingOut] = useState(false);
            const [isTeamBTimingOut, setIsTeamBTimingOut] = useState(false);
            const [timeOutModal, setTimeOutModal] = useState(false);

            window.addEventListener('storage', (event) => {
                switch (event.key) {
                    case "logoLeague" :
                        setLogoLeague(() =>
                            localStorage.getItem("logoLeague") ? localStorage.getItem("logoLeague") : ""
                        )
                        break;
                    case "logoTeamA" :
                        setLogoTeamA(() =>
                            localStorage.getItem("logoTeamA") ? localStorage.getItem("logoTeamA") : ""
                        )
                        break;

                    case "logoTeamB" :
                        setLogoTeamB(() =>
                            localStorage.getItem("logoTeamB") ? localStorage.getItem("logoTeamB") : ""
                        )
                        break;

                    case "teamAName" :
                        setTeamAName(() =>
                            localStorage.getItem("teamAName") ? localStorage.getItem("teamAName").toString() : ""
                        )
                        break;

                    case "teamBName" :
                        setTeamBName(() =>
                            localStorage.getItem("teamBName") ? localStorage.getItem("teamBName") : ""
                        )
                        break;

                    case "timer" :
                        setTimer(() =>
                            localStorage.getItem("timer") ? JSON.parse(localStorage.getItem("timer")) : "00:00"
                        )
                        break;

                    case "shotClock" :
                        setShotClock(() =>
                            localStorage.getItem("shotClock") ? JSON.parse(localStorage.getItem("shotClock")) : "24"
                        )
                        break;

                    case "scores" :
                        setScores(() =>
                            localStorage.getItem("scores") ? JSON.parse(localStorage.getItem("scores")) : ""
                        )
                        break;

                    case "faults" :
                        setFaults(() =>
                            localStorage.getItem("faults") ? JSON.parse(localStorage.getItem("faults")) : ""
                        )
                        break;

                    case "isLeft" :
                        setIsLeft(() =>
                            localStorage.getItem("isLeft") ? JSON.parse(localStorage.getItem("isLeft")) : ""
                        )
                        break;

                    case "period" :
                        setPeriod(() =>
                            localStorage.getItem("period") ? JSON.parse(localStorage.getItem("period")) : "1"
                        )
                        break;

                    case "overTime" :
                        setOverTime(() =>
                            localStorage.getItem("overTime") ? JSON.parse(localStorage.getItem("overTime")) : ""
                        )
                    break;

                    case "totalConsult" :
                        setTotalConsult(() =>
                            localStorage.getItem("totalConsult") ? JSON.parse(localStorage.getItem("totalConsult")) : "2"
                        )
                        break;

                    case "timeOutClock" :
                        setTimeOutClock(() =>
                            localStorage.getItem("timeOutClock") ? JSON.parse(localStorage.getItem("timeOutClock")) : ""
                        )
                        break;

                    case "isTeamATimingOut" :
                        setIsTeamATimingOut(() =>
                            localStorage.getItem("isTeamATimingOut") ? JSON.parse(localStorage.getItem("isTeamATimingOut")) : ""
                        )
                        break;

                    case "isTeamBTimingOut" :
                        setIsTeamBTimingOut(() =>
                            localStorage.getItem("isTeamBTimingOut") ? JSON.parse(localStorage.getItem("isTeamBTimingOut")) : ""
                        )
                        break;
                }
            })

            useEffect(() => {
                if (isTeamATimingOut || isTeamBTimingOut) {
                    setTimeOutModal(true)
                }
            },[isTeamATimingOut,isTeamBTimingOut])
                
            return (
                <>
                    {isTeamATimingOut || isTeamBTimingOut ? <div>
                        <div className="to-modal"></div>
                        <div class="modal-background">
                            <div style={{width: "33.33%", marginTop: "160px"}} class="team-a-info-modal team-info-modal">
                                <div class="modal-team-name">
                                    <div class="text">
                                        <h1>{teamAName.slice(1, -1)}</h1>
                                    </div>
                                </div>
                                <div class="modal-team-logo">
                                    {logoTeamA ? <img style={{width: "400px"}} src={logoTeamA}/> : <img src="./assets/teams-logo/default-logo.png" style={{width:"400px"}}/>}
                                </div>
                                <div class="modal-team-score">
                                    <p style={{fontSize: "100px", color: "white", margin: "0px"}}>{scores.teamAScore ? scores.teamAScore.toString().padStart(2, '0') : "00"}</p>
                                </div>
                            </div>

                            <div style={{width: "33.33%", marginTop: "160px"}} class="modal-info">
                                <h2>HỘI Ý</h2>
                                <div>{timeOutClock}</div>
                                <img className="league-logo-modal" src={logoLeague}/>
                            </div>

                            <div style={{width: "33.33%", marginTop: "160px"}} class="team-b-info-modal team-info-modal">
                                <div class="modal-team-name">
                                    <div class="text">
                                        <h1>{teamBName.slice(1, -1)}</h1>
                                    </div>
                                </div>
                                <div class="modal-team-logo">
                                    {logoTeamB ? <img style={{width: "400px"}} src={logoTeamB}/> : <img src="./assets/teams-logo/default-logo.png" style={{width:"400px"}}/>}
                                </div>
                                <div class="modal-team-score">
                                    <p style={{fontSize: "100px", color: "white", margin: "0px"}}>{scores.teamBScore ? scores.teamBScore.toString().padStart(2, '0') : "00"}</p>
                                </div>
                            </div>
                        </div>
                    </div> : <></>}
                    <div className="container">
                        <Grid container spacing={0.5}>
                            <Grid item md={3}>
                            </Grid>
                            <Grid item md={6}>
                            <h1 className="text fulltime">{timer ? timer : "00:00"}</h1>
                            </Grid>
                            <Grid item md={3}>
                            <div className="logo">
                                <img src={logoLeague}/>
                            </div>
                            </Grid>
                        </Grid>

                        <Grid container spacing={0.5}>
                            <Grid item md={3}>
                                {logoTeamA ? <img className="teams-logo" src={logoTeamA}/> : <img className="teams-logo" src="./assets/teams-logo/default-logo.png" style={{padding:"30px 0", width:"200px"}}/>}
                            </Grid>
                            <Grid item md={2}>
                            </Grid>
                            <Grid item md={2}>
                                <h1 style={{color: shotClock <= 5 ? "red" : "white"}} className="text twenty-four">{shotClock ? shotClock : 24}</h1>
                            </Grid>
                            <Grid item md={2}>
                            </Grid>
                            <Grid item md={3}>
                            {logoTeamB ? <img className="teams-logo" src={logoTeamB}/> : <img className="teams-logo" src="./assets/teams-logo/default-logo.png" style={{padding:"30px 0", width:"200px"}}/>}
                            </Grid>
                        </Grid>

                        <Grid container spacing={0.5}>
                            <Grid item md={4}>
                            <h1 className="text score ">{scores.teamAScore ? scores.teamAScore.toString().padStart(2, '0') : "00"}</h1>
                            </Grid>
                            <Grid item md={2}>
                            <div className="consult-fault">
                                <div className="fault">
                                <div className="text">LỖI</div>
                                <div className="text fault-numb">{faults.teamAFaults ? faults.teamAFaults : 0}</div>
                                </div>
                                {false && <div className="consult">
                                <img src="./assets/icons/full-ball.png"/>
                                <img src="./assets/icons/full-ball.png"/>
                                <img src="./assets/icons/empty-ball.png"/>
                                </div>}
                            </div>
                            </Grid>
                            <Grid item md={2}>
                            <div className="consult-fault">
                                <div className="fault">
                                <div className="text">LỖI</div>
                                <div className="text fault-numb">{faults.teamBFaults ? faults.teamBFaults : 0}</div>
                                </div>
                                {false && <div className="consult">
                                <img src="./assets/icons/full-ball.png"/>
                                <img src="./assets/icons/full-ball.png"/>
                                <img src="./assets/icons/empty-ball.png"/>
                                </div>}
                            </div>
                            </Grid>
                            <Grid item md={4}>
                            <h1 className="text score ">{scores.teamBScore ? scores.teamBScore.toString().padStart(2, '0') : "00"}</h1>
                            </Grid>
                        </Grid>

                        {false && <div className="possession">
                            <Grid container spacing={3}>
                            <Grid item md={4}>
                                <div className="left">
                                <img className="triangle" src="./assets/icons/triangle.png" style={{
                                    opacity: isLeft ? 0.2 : 1,
                                    transition: "opacity 0.3s ease",
                                }}/>
                                </div>
                            </Grid>
                            <Grid item md={4}></Grid>
                            <Grid item md={4}>
                                <img className="triangle right" src="./assets/icons/triangle.png" style={{
                                    opacity: !isLeft ? 0.2 : 1,
                                    transition: "opacity 0.3s ease",
                                }}/>
                            </Grid>
                            </Grid>
                        </div>}
                        <div className="teams-name">
                            <div className="left-team">
                            <span className="text">
                                <h1>{teamAName.slice(1, -1)}</h1>
                            </span>
                            </div>
                            <div className="right-team">
                            <span className="text">
                                <h1>{teamBName.slice(1, -1)}</h1>
                            </span>
                            </div>
                        </div>
                        <div className="period">
                            {!overTime ? <h1 className="text">HIỆP <span>{period ? period : 1}</span></h1>
                                : <h1 className="text">HIỆP PHỤ <span>{period ? period : 1}</span></h1>
                            }
                        </div>
                    </div>
                </>
            );
            };

            ReactDOM.createRoot(document.getElementById('root')).render(<Scoreboard />);
    </script>
  </body>
</html>
